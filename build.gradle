plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
	maven {
		name = 'IsXander'
		url = 'https://maven.isxander.dev/releases'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/apotheosis.accesswidener")

	mods {
		"apotheosis" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// YetAnotherConfigLib for configuration screen
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	// Optional ModMenu integration
	compileOnly "com.terraformersmc:modmenu:22.0.0-alpha.3"

	// Testing dependencies
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	duplicatesStrategy = DuplicatesStrategy.FAIL

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.named("processClientResources") {
	duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	duplicatesStrategy = DuplicatesStrategy.FAIL
	from("LICENSE")
	from("LICENSE_ASSETS")
	from("NOTICE")
}

// Verification task ensuring no duplicate class files exist across compile outputs
tasks.register("verifyNoDuplicateClasses") {
	dependsOn compileJava, compileClientJava
	doLast {
		def seenClasses = new HashSet<String>()
		def duplicateClasses = new ArrayList<String>()

		sourceSets.each { sourceSet ->
			sourceSet.output.classesDirs.each { dir ->
				if (dir.exists()) {
					dir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
						if (file.name.endsWith(".class")) {
							def relPath = dir.toPath().relativize(file.toPath()).toString()
							if (!seenClasses.add(relPath)) {
								duplicateClasses.add(relPath)
							}
						}
					}
				}
			}
		}

		if (!duplicateClasses.isEmpty()) {
			throw new GradleException("Duplicate classes detected across source sets:\n" + duplicateClasses.join("\n"))
		}
	}
}

check.dependsOn verifyNoDuplicateClasses
